[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "audit-vault"
version = "1.0.0"
description = "A secure, high-performance, and tamper-evident audit logging and vault system."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["audit", "vault", "merkle-tree", "cryptography", "security", "compliance"]
dependencies = [
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
audit-vault = "src.main:main"
audit-vault-verify = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
